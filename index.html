<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fondo Coding Cup 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07090c;
    --panel: #0f1217;
    --line: #1d222b;
    --text: #e6e8eb;
    --muted: #7b8494;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 24px 16px 40px;
  }
  .stage {
    width: min(100%, 1280px);
    aspect-ratio: 16 / 9;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
  }
  canvas { width: 100%; height: 100%; display: block; }

  .controls {
    width: min(100%, 1280px);
    display: grid;
    grid-template-columns: 1fr auto auto auto auto;
    gap: 12px;
    align-items: end;
  }
  .controls > * { min-width: 0; }
  select { width: 100%; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
  input[type=text], select, button {
    font: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 11px 14px;
    outline: none;
  }
  input[type=text]:focus, select:focus { border-color: #3a4352; }
  .check { flex-direction: row; align-items: center; gap: 8px; padding: 12px 0; cursor: pointer; font-size: 13px; color: var(--text); }
  .check input { accent-color: #5eead4; width: 16px; height: 16px; }
  .swatches { display: flex; gap: 8px; padding: 8px 0; }
  .sw {
    width: 26px; height: 26px; padding: 0; border-radius: 50%;
    border: 2px solid transparent; cursor: pointer;
  }
  .sw[aria-pressed="true"] { border-color: var(--text); }
  button.dl {
    background: var(--text); color: #07090c; border-color: var(--text);
    font-weight: 500; cursor: pointer;
  }
  button.dl:hover { opacity: .9; }
  .hint { width: min(100%, 1280px); font-size: 12px; color: var(--muted); }
  @media (max-width: 900px) {
    .controls { grid-template-columns: 1fr 1fr; }
    .controls label:first-child, .controls .dl { grid-column: 1 / -1; }
  }
</style>
</head>
<body>

<div class="stage" id="stage"><canvas id="cv"></canvas></div>

<div class="controls">
  <label>Nombre del equipo
    <input id="name" type="text" maxlength="80" value="Yaretzi y su Esencia" autocomplete="off">
  </label>
  <label>Color
    <div class="swatches" id="swatches"></div>
  </label>
  <label>Resolución
    <select id="res">
      <option value="1920x1080">1920 × 1080 (Full HD)</option>
      <option value="2560x1440">2560 × 1440 (2K)</option>
      <option value="3840x2160" selected>3840 × 2160 (4K)</option>
      <option value="1920x1200">1920 × 1200 (16:10)</option>
      <option value="1366x768">1366 × 768</option>
    </select>
  </label>
  <label class="check"><input id="code" type="checkbox" checked> Código de fondo</label>
  <button class="dl" id="dl">Descargar PNG</button>
</div>
<p class="hint">Tip: puedes compartir el link con <code>?equipo=Nombre</code> para que cargue otro nombre directamente.</p>

const ACCENTS = {
  menta:   "#5eead4",
  azul:    "#7aa2f7",
  violeta: "#b4a1ff",
  ambar:   "#f5c26b",
  blanco:  "#e6e8eb",
};

const CODE = [
  "#include <bits/stdc++.h>",
  "using namespace std;",
  "",
  "void solve() {",
  "    int n; cin >> n;",
  "    vector<long long> a(n);",
  "    for (auto &x : a) cin >> x;",
  "    sort(a.begin(), a.end());",
  "    cout << a.back() << '\\n';",
  "}",
  "",
  "int main() {",
  "    ios::sync_with_stdio(false);",
  "    cin.tie(nullptr);",
  "    int t; cin >> t;",
  "    while (t--) solve();",
  "    return 0;",
  "}",
];

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const nameEl = document.getElementById("name");
const resEl = document.getElementById("res");
const codeEl = document.getElementById("code");
const stage = document.getElementById("stage");

let accent = ACCENTS.menta;

const q = new URLSearchParams(location.search).get("equipo");
if (q) nameEl.value = q;

// Carga de logos (incrustados en base64, no ensucian el canvas al exportar)
const img = {};
const logosReady = Promise.all(Object.entries(LOGOS).map(([k, b64]) => new Promise(res => {
  const i = new Image();
  i.onload = () => { img[k] = i; res(); };
  i.onerror = res;
  i.src = "data:image/png;base64," + b64;
})));

const swWrap = document.getElementById("swatches");
Object.entries(ACCENTS).forEach(([k, v], i) => {
  const b = document.createElement("button");
  b.className = "sw";
  b.title = k;
  b.style.background = v;
  b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
  b.onclick = () => {
    accent = v;
    swWrap.querySelectorAll(".sw").forEach(s => s.setAttribute("aria-pressed", "false"));
    b.setAttribute("aria-pressed", "true");
    render();
  };
  swWrap.appendChild(b);
});

function getSize() {
  const [w, h] = resEl.value.split("x").map(Number);
  return { W: w, H: h };
}

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}

function spacing(px) { if ("letterSpacing" in ctx) ctx.letterSpacing = px + "px"; }

// Dibuja un logo con altura fija; devuelve el ancho usado
function drawLogo(key, x, y, h, alpha = 1, align = "left") {
  const i = img[key];
  if (!i) return 0;
  const w = i.width * (h / i.height);
  ctx.globalAlpha = alpha;
  ctx.drawImage(i, align === "right" ? x - w : x, y, w, h);
  ctx.globalAlpha = 1;
  return w;
}

// Parte el nombre en N líneas lo más parejas posible
function splitLines(words, n) {
  if (n <= 1 || words.length < n) return [words.join(" ")];
  let best = null;
  const rec = (start, left, acc) => {
    if (left === 1) {
      const lines = [...acc, words.slice(start).join(" ")];
      const score = Math.max(...lines.map(l => ctx.measureText(l).width));
      if (!best || score < best.score) best = { score, lines };
      return;
    }
    for (let i = start + 1; i <= words.length - left + 1; i++) {
      rec(i, left - 1, [...acc, words.slice(start, i).join(" ")]);
    }
  };
  rec(0, n, []);
  return best.lines;
}

function layoutName(text, W, H) {
  const words = text.split(/\s+/).filter(Boolean);
  const maxW = W * 0.74;
  const maxSize = H * 0.125;
  const maxBlockH = H * 0.36;
  const lh = 1.08;
  let best = null;
  spacing(0);
  for (let n = 1; n <= Math.min(3, Math.max(1, words.length)); n++) {
    ctx.font = `600 100px "Space Grotesk"`;
    const lines = splitLines(words, n);
    const widest = Math.max(...lines.map(l => ctx.measureText(l).width));
    const size = Math.min(maxSize, (maxW / widest) * 100, maxBlockH / (n * lh));
    const score = size * (n === 1 ? 1.25 : 1);
    if (!best || score > best.score) best = { score, size, lines };
  }
  return { ...best, lh };
}

// Línea horizontal que se desvanece en los extremos
function hairline(x1, x2, y, a, u) {
  const g = ctx.createLinearGradient(x1, 0, x2, 0);
  g.addColorStop(0, "rgba(255,255,255,0)");
  g.addColorStop(0.15, `rgba(255,255,255,${a})`);
  g.addColorStop(0.85, `rgba(255,255,255,${a})`);
  g.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = g;
  ctx.fillRect(x1, y, x2 - x1, Math.max(1, u));
}

function render() {
  const { W, H } = getSize();
  cv.width = W; cv.height = H;
  stage.style.aspectRatio = `${W} / ${H}`;
  const u = H / 1080;
  const mx = Math.max(72 * u, W * 0.045), my = 64 * u;

  // ---------- Fondo ----------
  ctx.fillStyle = "#07090c";
  ctx.fillRect(0, 0, W, H);

  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.55);
  g.addColorStop(0, hexA(accent, 0.08));
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Resplandor secundario, esquina inferior derecha
  const g2 = ctx.createRadialGradient(W, H, 0, W, H, W * 0.45);
  g2.addColorStop(0, hexA(accent, 0.05));
  g2.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g2;
  ctx.fillRect(0, 0, W, H);

  // Retícula de puntos
  const step = 36 * u;
  const cx = W / 2, cy = H / 2, rMax = Math.hypot(cx, cy);
  for (let x = (W % step) / 2; x < W; x += step) {
    for (let y = (H % step) / 2; y < H; y += step) {
      const d = Math.hypot(x - cx, y - cy) / rMax;
      const a = 0.10 * (1 - d * 0.8);
      if (a <= 0) continue;
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.fillRect(x - 0.9 * u, y - 0.9 * u, 1.8 * u, 1.8 * u);
    }
  }

  // Código C++ muy tenue de fondo
  if (codeEl.checked) {
    const fs = 19 * u, lh = fs * 1.75;
    ctx.font = `400 ${fs}px "JetBrains Mono"`;
    spacing(0);
    ctx.textBaseline = "alphabetic";
    const codeW = Math.max(...CODE.map(l => ctx.measureText(l).width));
    const x0 = W - mx - codeW - 20 * u;
    const y0 = H / 2 - (CODE.length * lh) / 2 + 30 * u;
    CODE.forEach((ln, i) => {
      const y = y0 + i * lh;
      const fade = 1 - Math.abs((i - CODE.length / 2) / (CODE.length / 2)) * 0.6;
      ctx.textAlign = "right";
      ctx.fillStyle = `rgba(255,255,255,${0.05 * fade})`;
      ctx.fillText(String(i + 1), x0 - 28 * u, y);
      ctx.textAlign = "left";
      ctx.fillStyle = `rgba(255,255,255,${0.055 * fade})`;
      ctx.fillText(ln, x0, y);
    });
  }

  // ---------- Encabezado ----------
  const logoH = 132 * u;
  const topY = my;
  // CoyotesDev (izquierda)
  drawLogo("coyotes", mx, topY, logoH, 0.95);

  // Coding Cup 2026 (derecha)
  const midY = topY + logoH / 2;
  ctx.textAlign = "right";
  ctx.textBaseline = "alphabetic";
  const ccSize = 44 * u;
  ctx.font = `600 ${ccSize}px "Space Grotesk"`;
  spacing(-ccSize * 0.02);
  const yearW = ctx.measureText("2026").width;
  ctx.fillStyle = accent;
  ctx.fillText("2026", W - mx, midY + ccSize * 0.18);
  ctx.fillStyle = "#f2f4f6";
  ctx.fillText("Coding Cup ", W - mx - yearW, midY + ccSize * 0.18);

  ctx.font = `500 ${14 * u}px "JetBrains Mono"`;
  spacing(14 * u * 0.3);
  ctx.fillStyle = "rgba(230,232,235,0.45)";
  ctx.fillText("CONCURSO DE PROGRAMACIÓN", W - mx + 14 * u * 0.3, midY - ccSize * 0.75);
  ctx.fillText("TECNM · ICPC MÉXICO", W - mx + 14 * u * 0.3, midY + ccSize * 0.95);
  spacing(0);

  // Líneas divisorias
  const lineTop = topY + logoH + 40 * u;
  const footH = 68 * u;
  const lineBot = H - my - footH - 36 * u;
  hairline(mx, W - mx, lineTop, 0.09, u);
  hairline(mx, W - mx, lineBot, 0.09, u);

  // ---------- Pie ----------
  const fy = H - my - footH;
  let fx = mx;
  fx += drawLogo("icpc", fx, fy, footH, 0.7);
  fx += 34 * u;
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.fillRect(fx, fy + 6 * u, Math.max(1, u), footH - 12 * u);
  fx += 34 * u;
  drawLogo("tecnm", fx, fy, footH, 0.7);

  // Barra de estado tipo editor (derecha)
  ctx.font = `400 ${15 * u}px "JetBrains Mono"`;
  ctx.textBaseline = "middle";
  ctx.textAlign = "right";
  const sy = fy + footH / 2;
  const parts = ["C++17", "UTF-8", "LF"];
  let sx = W - mx;
  ctx.fillStyle = "rgba(255,255,255,0.32)";
  for (let k = parts.length - 1; k >= 0; k--) {
    ctx.fillText(parts[k], sx, sy);
    sx -= ctx.measureText(parts[k]).width + 30 * u;
  }
  ctx.fillText("listo para competir", sx, sy);
  sx -= ctx.measureText("listo para competir").width + 14 * u;
  ctx.fillStyle = accent;
  ctx.shadowColor = hexA(accent, 0.8); ctx.shadowBlur = 12 * u;
  ctx.beginPath(); ctx.arc(sx - 5 * u, sy, 5 * u, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;

  // ---------- Bloque central ----------
  const name = nameEl.value.trim() || "Nombre del equipo";
  const { size, lines, lh } = layoutName(name, W, H);
  const lineH = size * lh;
  const blockH = lineH * lines.length;
  const tagSize = 22 * u;
  const gap = Math.max(30 * u, size * 0.38);
  const totalH = tagSize + gap + blockH;
  const areaMid = (lineTop + lineBot) / 2;
  const top = areaMid - totalH / 2;

  // "// MUCHA SUERTE"
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";
  ctx.font = `500 ${tagSize}px "JetBrains Mono"`;
  spacing(tagSize * 0.3);
  const tag = "MUCHA SUERTE", sl = "// ";
  const tagW = ctx.measureText(sl + tag).width - tagSize * 0.3;
  const slW = ctx.measureText(sl).width;
  const tagY = top + tagSize / 2;
  ctx.fillStyle = accent;
  ctx.fillText(sl, W / 2 - tagW / 2, tagY);
  ctx.fillStyle = "rgba(230,232,235,0.66)";
  ctx.fillText(tag, W / 2 - tagW / 2 + slW, tagY);
  spacing(0);

  // Nombre del equipo
  ctx.font = `600 ${size}px "Space Grotesk"`;
  spacing(-size * 0.025);
  ctx.textAlign = "center";
  ctx.fillStyle = "#f4f6f8";
  let lastY = 0, lastRight = 0;
  lines.forEach((ln, i) => {
    const y = top + tagSize + gap + lineH * i + lineH / 2;
    ctx.fillText(ln, W / 2, y);
    lastY = y;
    lastRight = W / 2 + ctx.measureText(ln).width / 2;
  });
  spacing(0);

  // Cursor de terminal
  const cw = size * 0.09, ch = size * 0.78;
  ctx.shadowColor = hexA(accent, 0.6);
  ctx.shadowBlur = 24 * u;
  ctx.fillStyle = accent;
  ctx.fillRect(lastRight + size * 0.1, lastY - ch / 2 + size * 0.04, cw, ch);
  ctx.shadowBlur = 0;
}

function slug(s) {
  return s.normalize("NFD").replace(/[̀-ͯ]/g, "")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "equipo";
}

document.getElementById("dl").onclick = () => {
  render();
  cv.toBlob(b => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = `fondo-codingcup2026-${slug(nameEl.value)}-${resEl.value}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, "image/png");
};

nameEl.addEventListener("input", render);
resEl.addEventListener("change", render);
codeEl.addEventListener("change", render);

Promise.all([
  logosReady,
  document.fonts.load('600 100px "Space Grotesk"'),
  document.fonts.load('500 20px "JetBrains Mono"'),
  document.fonts.load('400 20px "JetBrains Mono"'),
]).finally(render);
render();
</script>
</body>
